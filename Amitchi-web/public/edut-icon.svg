<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.85" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner glowing border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="4" />

  <!-- Stylized Education / Academic Crest Shield with 'E' -->
  <g filter="url(#shadow)" transform="translate(106, 86)">
    <!-- Graduation Cap / Diamond crest top -->
    <path d="M150 20 L270 85 L150 150 L30 85 Z" fill="url(#shieldGrad)" />
    <!-- Tassel -->
    <path d="M250 90 L265 140 L255 145 L245 95 Z" fill="#fbbf24" />
    <circle cx="260" cy="148" r="8" fill="#f59e0b" />

    <!-- Stylized Modern 'E' and Book base -->
    <path d="M50 170 L250 170 C265 170 275 182 275 198 L275 208 C275 220 265 230 250 230 L110 230 L110 250 L230 250 C245 250 255 260 255 275 L255 282 C255 295 245 305 230 305 L110 305 L110 325 L255 325 C270 325 280 338 280 352 L280 360 C280 375 268 385 250 385 L50 385 C35 385 25 372 25 355 L25 200 C25 182 35 170 50 170 Z" fill="url(#shieldGrad)" />
  </g>
</svg>
